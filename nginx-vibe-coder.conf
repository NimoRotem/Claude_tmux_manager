# Nginx Configuration for dianao.tech — Vibe Coder
# Replaces static site with reverse proxy to the vibe-coder app

server {
    listen 80;
    server_name dianao.tech www.dianao.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dianao.tech www.dianao.tech;

    ssl_certificate /etc/letsencrypt/live/dianao.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dianao.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
}
