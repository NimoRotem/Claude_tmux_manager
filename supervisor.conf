[program:tmux-dashboard]
command=python3 %(here)s/app.py
directory=%(here)s
user=%(ENV_USER)s
autostart=true
autorestart=true
stderr_logfile=/var/log/tmux-dashboard.err.log
stdout_logfile=/var/log/tmux-dashboard.out.log
environment=HOME="%(ENV_HOME)s",OPENAI_API_KEY="YOUR_KEY_HERE",TMUX_DASH_USER="admin",TMUX_DASH_PASS="changeme",TMUX_DASH_PORT="8501",TMUX_DASH_ROOT_PATH="/tmux",TMUX_DASH_NEW_SESSION_CMD=""
